server:
  port: 8080
spring:
  application:
    name: hotel-management-system
    #-----------------Database-----------------------
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimeZone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
#---------------------JPA/Hibernate-----------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  #--------------Profile--------------------
  profiles:
    active: dev
#-------------------Liquibase------------------
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml
#-------------------------LOGGING---------------
logging:
  level:
    com.stayease: DEBUG        # Verbose for our own code
    org.springframework.security: DEBUG   # See security decisions in logs
    org.hibernate.SQL: DEBUG   # SQL log (redundant with show-sql but explicit)
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
#--------------------------for JWT---------------------------------------
hotel:
  jwt:
    secret: 5A7134743777217A25432A462D4A614E645267556B58703272357538782F413F
    expiration-ms: 86400000